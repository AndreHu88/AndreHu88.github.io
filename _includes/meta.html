    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'>
    <meta name="keywords" content="Jack Hu, 胡勇, 技术, 投资, 阅读, 知识管理, 实用工具, huyong, sohod.cn">

    {% assign meta_tool = site.data.tools | where: "slug", page.tool | first %}
    {% if meta_tool %}
    <meta name="description" content="{{ meta_tool.summary }}" />
    <meta property="og:description" content="{{ meta_tool.summary }}" />
    {% elsif page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html }}" />
    {% else %}
    <meta name="description" content="{{ site.description }}">
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta name="author" content="{{ site.name }}" />

    {% if meta_tool %}
    <meta property="og:title" content="{{ meta_tool.title }}" />
    <meta property="twitter:title" content="{{ meta_tool.title }}" />
    {% elsif page.title %}
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="twitter:title" content="{{ page.title }}" />



    {% endif %}
