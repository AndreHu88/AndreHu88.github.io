{% case include.tool.slug %}
{% when 'base64' %}
<form class="tool-form" data-tool-form><label>待处理文本<textarea name="source" rows="11" placeholder="输入普通文本或 Base64 内容" required></textarea></label><div class="tool-actions"><button class="button button--primary" name="action" value="encode">编码</button><button class="button button--ghost" name="action" value="decode">解码</button><button class="tool-reset" type="button" data-tool-swap>交换</button><button class="tool-reset" type="reset">清空</button></div></form>
{% when 'text-stats' %}
<form class="tool-form" data-tool-form><label>文本内容<textarea name="source" rows="14" placeholder="输入或粘贴需要统计的文本"></textarea></label><div class="tool-actions"><button class="tool-reset" type="reset">清空文本</button></div></form>
{% when 'url-codec' %}
<form class="tool-form" data-tool-form><label>处理模式<select name="mode"><option value="component">参数组件（encodeURIComponent）</option><option value="url">完整 URL（encodeURI）</option></select></label><label>URL 或文本<textarea name="source" rows="10" placeholder="https://example.com/?q=中文" required></textarea></label><div class="tool-actions"><button class="button button--primary" name="action" value="encode">编码</button><button class="button button--ghost" name="action" value="decode">解码</button><button class="tool-reset" type="reset">清空</button></div></form>
{% when 'json-formatter' %}
<form class="tool-form" data-tool-form><label>JSON 内容<textarea name="source" rows="13" spellcheck="false" placeholder='{"name":"Jack Hu"}' required></textarea></label><div class="tool-actions"><button class="button button--primary" name="action" value="pretty">格式化</button><button class="button button--ghost" name="action" value="compact">压缩</button><button class="tool-reset" type="reset">清空</button></div></form>
{% when 'case-converter' %}
<form class="tool-form" data-tool-form><label>转换格式<select name="mode"><option value="upper">全部大写</option><option value="lower">全部小写</option><option value="sentence">句首大写</option><option value="title">英文标题格式</option><option value="camel">camelCase</option><option value="pascal">PascalCase</option><option value="snake">snake_case</option><option value="kebab">kebab-case</option></select></label><label>文本内容<textarea name="source" rows="12" placeholder="输入需要转换的文本" required></textarea></label><div class="tool-actions"><button class="button button--primary" name="action" value="convert">转换</button><button class="tool-reset" type="button" data-tool-swap>交换</button><button class="tool-reset" type="reset">清空</button></div></form>
{% when 'list-cleaner' %}
<form class="tool-form" data-tool-form><label>每行一项<textarea name="source" rows="12" placeholder="苹果&#10;香蕉&#10;苹果" required></textarea></label><div class="tool-fields tool-fields--2"><label>排列方式<select name="sort"><option value="keep">保持原顺序</option><option value="asc">自然升序</option><option value="desc">自然降序</option><option value="reverse">反转顺序</option></select></label><label class="tool-check"><input name="caseSensitive" type="checkbox">去重时区分大小写</label></div><div class="tool-option-grid"><label class="tool-check"><input name="trim" type="checkbox" checked>清理首尾空格</label><label class="tool-check"><input name="removeEmpty" type="checkbox" checked>移除空行</label><label class="tool-check"><input name="dedupe" type="checkbox" checked>移除重复项</label></div><div class="tool-actions"><button class="button button--primary" name="action" value="clean">整理列表</button><button class="tool-reset" type="reset">重置</button></div></form>
{% endcase %}
