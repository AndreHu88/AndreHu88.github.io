{% case include.tool.slug %}
{% when 'qr-generator' %}
<form class="tool-form" data-tool-form><label>二维码类型<select name="mode" data-qr-mode><option value="text">文本</option><option value="url">网址</option><option value="wifi">Wi-Fi</option></select></label><div data-qr-content><label>内容<textarea name="content" rows="8" placeholder="输入文本或网址"></textarea></label></div><div data-qr-wifi hidden><label>Wi-Fi 名称<input name="ssid" type="text"></label><label data-wifi-password>Wi-Fi 密码<input name="password" type="text"></label><div class="tool-fields tool-fields--2"><label>安全类型<select name="security"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">无密码</option></select></label><label class="tool-check"><input name="hidden" type="checkbox">隐藏网络</label></div></div><div class="tool-actions"><button class="button button--primary" name="action" value="generate">生成二维码</button><button class="tool-reset" type="reset">重置</button></div><p class="tool-hint">使用 M 级纠错，内容不会上传。最多 2000 个 UTF-8 字节。</p></form>
{% when 'random-picker' %}
<form class="tool-form" data-tool-form><label>候选名单（每行一项）<textarea name="source" rows="12" placeholder="小明&#10;小红&#10;小李" required></textarea></label><div class="tool-fields tool-fields--2"><label>抽取数量<input name="count" type="number" min="1" step="1" value="1" required></label><label class="tool-check"><input name="dedupe" type="checkbox" checked>抽取前去重</label></div><div class="tool-actions"><button class="button button--primary" name="action" value="pick">随机抽取</button><button class="button button--ghost" name="action" value="shuffle">打乱全部</button><button class="tool-reset" type="reset">重置</button></div></form>
{% when 'dice-roller' %}
<form class="tool-form" data-tool-form><label>模式<select name="mode" data-random-mode><option value="dice">投掷骰子</option><option value="integer">生成随机整数</option></select></label><div data-dice-fields><div class="tool-fields tool-fields--3"><label>骰子数量<input name="diceCount" type="number" min="1" max="20" step="1" value="2"></label><label>每个面数<input name="sides" type="number" min="2" max="1000" step="1" value="6"></label><label>修正值<input name="modifier" type="number" step="1" value="0"></label></div></div><div data-integer-fields hidden><div class="tool-fields tool-fields--3"><label>最小值<input name="minimum" type="number" step="1" value="1"></label><label>最大值<input name="maximum" type="number" step="1" value="100"></label><label>生成数量<input name="integerCount" type="number" min="1" max="1000" step="1" value="1"></label></div></div><div class="tool-actions"><button class="button button--primary" name="action" value="generate">开始生成</button><button class="tool-reset" type="reset">重置</button></div></form>
{% endcase %}
